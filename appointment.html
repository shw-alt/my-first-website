<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment - SmartCare</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef5ff;
            min-height: 100vh;
        }

        /* Navbar */
        nav {
            height: 70px;
            background: #101329;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #4db8ff;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-size: 16px;
        }

        nav a:hover {
            color: #4db8ff;
        }

        /* Main Section */
        .container {
            width: 90%;
            max-width: 900px;
            margin: 50px auto;
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .left {
            width: 45%;
        }

        .left h1 {
            font-size: 42px;
            color: #15244d;
            margin-bottom: 15px;
        }

        .left p {
            color: #667085;
            line-height: 1.7;
            font-size: 17px;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        /* Form Card */
        .form-card {
            width: 55%;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(30, 60, 100, 0.15);
        }

        .form-card h2 {
            text-align: center;
            color: #172554;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #344054;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #3b9cff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #1597d4;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #087bb5;
        }

        .note {
            text-align: center;
            margin-top: 15px;
            color: #667085;
            font-size: 13px;
        }

        /* Mobile */
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }

            .left, .form-card {
                width: 100%;
            }

            .left h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">🏥 Smart<span>Care</span></div>

        <div>
            <a href="index.html">Home</a>
            <a href="#">Services</a>
            <a href="#">Doctors</a>
            <a href="#">Contact</a>
        </div>
    </nav>


    <!-- Appointment Section -->
    <div class="container">

        <div class="left">
            <div class="icon">📅</div>

            <h1>Book Your Appointment</h1>

            <p>
                Schedule your hospital appointment easily
                and get connected with the right doctor.
                SmartCare makes healthcare simple, fast
                and organized.
            </p>
        </div>


        <div class="form-card">

            <h2>Appointment Details</h2>

            <form>

                <label>Patient Name</label>
                <input type="text"
                       placeholder="Enter your name">

                <label>Select Doctor</label>
                <select>
                    <option>Select Doctor</option>
                    <option>Dr. Sharma</option>
                    <option>Dr. Verma</option>
                    <option>Dr. Singh</option>
                </select>

                <label>Appointment Date</label>
                <input type="date">

                <label>Appointment Time</label>
                <input type="time">

                <button type="submit">
                    📅 Book Appointment
                </button>

                <p class="note">
                    Your appointment details will be kept secure.
                </p>

            </form>

        </div>

    </div>

</body>
</html>
